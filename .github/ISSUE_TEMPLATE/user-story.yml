name: "User Story"
description: "Create a new user story"
title: "US#[X]: [Short Title]"
labels: ["user-story"]

body:
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "Write the user story in this format: As a [user/persona], I want to [do something], so I can [achieve some goal]."
      placeholder: "As a user, I want to ..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Use the Given/When/Then format."
      placeholder: |
        Given [context]
        When [action]
        Then [outcome]
    validations:
      required: true

  - type: input
    id: story-points
    attributes:
      label: Story Points
      description: "Estimate effort (e.g., 1, 3, 5, 8)."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low

  - type: dropdown
    id: value
    attributes:
      label: Value
      options:
        - High
        - Medium
        - Low

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - High
        - Medium
        - Low
