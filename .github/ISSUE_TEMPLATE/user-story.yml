name: "User Story"
description: "Template for creating a new user story"
title: "US#[X]: [Short Title]"
labels: ["user-story"]

body:
  - type: markdown
    attributes:
      value: "## User Story"

  - type: textarea
    id: user-story
    attributes:
      label: "User Story"
      description: "Write the story in the format: As a [user/persona], I want to [do something], so I can [achieve goal]."
      placeholder: "As a user, I want to …, so I can …"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Acceptance Criteria"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "Use bullet points. Keep each item testable."
      value: |
        - The user …
        - The system …
        - Errors are handled …
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Story Details"

  - type: input
    id: story-points
    attributes:
      label: "Story Points"
      description: "Estimate effort (e.g., 1, 2, 3, 5, 8)"
      placeholder: "3"

  - type: input
    id: priority
    attributes:
      label: "Priority"
      description: "e.g., High / Medium / Low"
      placeholder: "High"

  - type: input
    id: value
    attributes:
      label: "Value"
      description: "e.g., High / Medium / Low"
      placeholder: "High"

  - type: input
    id: risk
    attributes:
      label: "Risk"
      description: "e.g., High / Medium / Low"
      placeholder: "Medium"

