name: "User Story"
description: "Template for creating a new user story"
title: "US#[X]: [Short Title]"
labels: ["user-story"]

body:
  - type: markdown
    attributes:
      value: "## User Story"

  - type: textarea
    id: user-story
    attributes:
      label: "User Story"
      description: "Write the story in the format: As a [user/persona], I want to [do something], so I can [achieve goal]."
      placeholder: "As a user, I want to …, so I can …"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Acceptance Criteria"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "List acceptance criteria using Given/When/Then or bullet points."
      placeholder: |
        - Given [context]
        - When [action]
        - Then [outcome]
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Story Details"

  - type: input
    id: story-points
    attributes:
      label: "Story Points"
      placeholder: "e.g. 3"

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - High
        - Medium
        - Low

  - type: dropdown
    id: value
    attributes:
      label: "Value"
      options:
        - High
        - Medium
        - Low

  - type: dropdown
    id: risk
    attributes:
      label: "Risk"
      options:
        - High
        - Medium
        - Low
