name: "User Story"
description: "Template for creating a new user story"
title: "US#[X]: [Short Title]"
labels: ["user-story"]

body:
  - type: markdown
    attributes:
      value: "## User Story"

  - type: textarea
    id: user-story
    attributes:
      label: "User Story"
      description: "Write the story in the format: As a [user/persona], I want to [do something], so I can [achieve goal]."
      placeholder: "As a user, I want to …, so I can …"
    validations:
      required: true
--- 
  - type: markdown
    attributes:
      value: "## Acceptance Criteria"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "Use bullet points. Keep each item testable."
      value: |
        - User …
        - User …
        - User …
    validations:
      required: true
---
  - type: markdown
    attributes:
      value: "## Story Details"

  - type: textarea
    id: story-details
    attributes:
      label: "Story Details"
      description: "Keep this block; just fill the values."
      value: |
        **Story Points:** 
        **Priority:** 
        **Value:**  
        **Risk:** 
    validations:
      required: true
